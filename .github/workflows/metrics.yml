name: Generate profile metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Isometric full-year contribution calendar. Deliberately minimal: the
      # metrics "community"/"repositories" sections report stars, forks,
      # sponsors and org counts, which are all zero here because the work
      # lives in private client repositories.
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics/calendar.svg
          user: eclipseagency
          base: ""
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Refresh the contributions badge value
        run: python3 scripts/gen-contributions-badge.py

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/contributions.json
          git diff --quiet --cached || git commit -m "Refresh contributions badge [skip ci]"
          git pull --rebase --autostash origin main
          git push
