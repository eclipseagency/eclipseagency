name: Generate profile metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Isometric full-year contribution calendar. Deliberately minimal: the
      # metrics "community"/"repositories" sections report stars, forks,
      # sponsors and org counts, which are all zero here because the work
      # lives in private client repositories.
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics/calendar.svg
          user: eclipseagency
          base: ""
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
